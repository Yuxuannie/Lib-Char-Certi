<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lib-Char-Certi Console</title>
<style>
/* ============================================================
   Lib-Char-Certi Console — clean, modern, professional dashboard.
   Self-contained (air-gapped EDA host: no CDN/npm/pip; system fonts).
   Data injected as window.CERTI_DATA; embedded demo fallback below.
   ============================================================ */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc;
  --border:#e6e8ec; --border-2:#d7dbe0;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#8a94a6; --ink-4:#aab2c0;
  --accent:#2563eb; --accent-weak:#eef3ff; --accent-line:#c9dbff;
  --ok:#15803d; --ok-bg:#e8f6ec; --ok-line:#bfe3c9;
  --warn:#b45309; --warn-bg:#fdf2e0; --warn-line:#f3ddb3;
  --bad:#b91c1c; --bad-bg:#fdecec; --bad-line:#f4c9c9;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
  --mono:"SFMono-Regular",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 4px 16px rgba(16,24,40,.08),0 2px 6px rgba(16,24,40,.05);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}

/* ---------------- sidebar ---------------- */
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:18px 20px;border-bottom:1px solid var(--border)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#4f7dff);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.brand .t{font-weight:650;font-size:14.5px;letter-spacing:-.2px}
.brand .s{font-size:11px;color:var(--ink-3);margin-top:1px}
nav{padding:12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-h{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-4);padding:12px 12px 6px;font-weight:600}
.navItem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink-2);
  cursor:pointer;font-size:13px;font-weight:500;user-select:none;transition:background .12s,color .12s}
.navItem:hover{background:var(--surface-2);color:var(--ink)}
.navItem.active{background:var(--accent-weak);color:var(--accent)}
.navItem .ic{width:18px;height:18px;display:grid;place-items:center;opacity:.9}
.navItem svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.side-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-3)}
.side-foot b{color:var(--ink-2);font-weight:600}

/* ---------------- main ---------------- */
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;height:60px;padding:0 28px;background:var(--surface);
  border-bottom:1px solid var(--border)}
.topbar h2{font-size:15px;font-weight:650;margin:0;letter-spacing:-.2px}
.topbar .sub{font-size:12px;color:var(--ink-3);margin-left:2px}
.spacer{flex:1}
.selwrap{display:flex;align-items:center;gap:8px}
.selwrap label{font-size:11px;color:var(--ink-3);font-weight:500}
select,input{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-2);border-radius:8px;padding:8px 11px;outline:none;transition:border .12s,box-shadow .12s}
select:hover{border-color:var(--ink-4)}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.content{flex:1;min-height:0;overflow:auto;padding:26px 28px}

/* ---------------- view transitions ---------------- */
.view{display:none}
.view.show{display:block;animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sec h3{font-size:13px;font-weight:650;margin:0;letter-spacing:-.1px}
.sec .badge{font-size:11px;color:var(--ink-3)}
.sec .accent{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:22px 24px}
.row{display:grid;gap:16px}
.row.k4{grid-template-columns:repeat(4,1fr)}
.row.k2{grid-template-columns:1.4fr 1fr}
@media(max-width:1080px){.row.k4{grid-template-columns:repeat(2,1fr)}.row.k2{grid-template-columns:1fr}}

/* ---------------- stat tiles ---------------- */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:27px;font-weight:680;margin-top:8px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.stat .d{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)}

/* ---------------- pipeline ---------------- */
.pipe{display:flex;gap:14px}
.step{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px;position:relative;box-shadow:var(--shadow)}
.step .dot{width:9px;height:9px;border-radius:50%;position:absolute;top:16px;right:16px}
.step[data-s="passed"] .dot{background:var(--ok)} .step[data-s="partial"] .dot{background:var(--warn)}
.step[data-s="failed"] .dot{background:var(--bad)} .step[data-s="skipped"] .dot{background:var(--ink-4)}
.step[data-s="pending"] .dot{background:#d7dbe0} .step[data-s="running"] .dot{background:var(--accent);animation:blip 1s infinite}
@keyframes blip{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(37,99,235,.4)}50%{opacity:.5;box-shadow:0 0 0 5px rgba(37,99,235,0)}}
.step .n{font-size:11px;color:var(--ink-3);font-weight:500}
.step .nm{font-size:13.5px;font-weight:600;margin-top:8px}
.step .r{font-size:11.5px;color:var(--ink-3);margin-top:6px;min-height:14px}

/* ---------------- tables ---------------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{font-size:11px;color:var(--ink-3);font-weight:600;text-align:right;padding:11px 14px;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface-2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .corner{font-weight:600;color:var(--ink)}
.tbl .typ{color:var(--ink-3);font-size:12px}
.num{font-family:var(--mono);font-weight:600;font-size:12.5px}
.num.hi{color:var(--ok)} .num.mid{color:var(--warn)} .num.lo{color:var(--bad)} .num.na{color:var(--ink-4)}
.tblcard{overflow:hidden;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow)}
.tblcard .scroll{max-height:none;overflow:auto}

.cov{display:inline-flex;align-items:center;gap:9px;justify-content:flex-end}
.cov .t{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.bar{width:60px;height:6px;border-radius:99px;background:#eceef2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left;animation:gw .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes gw{from{transform:scaleX(0)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%}
.pill.OK{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)} .pill.OK::before{background:var(--ok)}
.pill.LOW_COVERAGE{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)} .pill.LOW_COVERAGE::before{background:var(--warn)}
.pill.NO_DATA{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)} .pill.NO_DATA::before{background:var(--bad)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);margin-bottom:18px;border:1px solid;font-size:13px;line-height:1.45}
.alert .ai{width:18px;height:18px;flex:none;margin-top:1px}
.alert.NO_DATA{background:var(--bad-bg);border-color:var(--bad-line);color:#7f1d1d}
.alert.LOW_COVERAGE{background:var(--warn-bg);border-color:var(--warn-line);color:#7c4a08}

/* ---------------- forms / setup ---------------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.f{display:flex;flex-direction:column;gap:8px}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:3px;gap:2px;width:fit-content}
.seg span{padding:7px 16px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.12s}
.seg span.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border:1px solid var(--border-2);border-radius:8px;font-size:12.5px;font-weight:500;
  color:var(--ink-2);cursor:pointer;user-select:none;transition:.12s;background:var(--surface)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* corner tag editor */
.tagbox{border:1px solid var(--border-2);border-radius:9px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;background:var(--surface);transition:.12s}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.tag{display:inline-flex;align-items:center;gap:7px;background:var(--accent-weak);color:var(--accent);border:1px solid var(--accent-line);
  border-radius:7px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:600;font-family:var(--mono)}
.tag b{font-weight:600}
.tag .x{cursor:pointer;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:var(--accent);opacity:.7}
.tag .x:hover{background:#fff;opacity:1}
.tagbox input{border:none;outline:none;box-shadow:none;flex:1;min-width:170px;padding:6px;font-family:var(--mono);font-size:12.5px}
.tagbox input:focus{box-shadow:none}
.suggest{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:4px}
.suggest .lbl{font-size:11.5px;color:var(--ink-3);margin-right:2px}
.sug{font-family:var(--mono);font-size:11.5px;border:1px dashed var(--border-2);border-radius:7px;padding:4px 9px;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.sug:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.actions{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.btn{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:9px;padding:10px 18px;border:1px solid var(--border-2);
  background:var(--surface);color:var(--ink);transition:.12s}
.btn:hover{border-color:var(--ink-4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{background:#1d4fd7;box-shadow:var(--shadow-lg)}
.btn svg{width:15px;height:15px;vertical-align:-3px;margin-right:6px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------------- history / compare ---------------- */
.brow{display:grid;grid-template-columns:22px 1.5fr repeat(4,1fr) 96px;align-items:center;gap:14px;
  padding:15px 18px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;background:var(--surface);
  box-shadow:var(--shadow);cursor:pointer;transition:.12s}
.brow:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.brow.sel{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-weak),var(--surface))}
.brow .nm{font-weight:650}
.brow .meta{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.brow .mk{font-size:10.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.brow .mv{font-size:15px;font-weight:680;font-variant-numeric:tabular-nums;font-family:var(--mono);margin-top:3px}
.ck{width:18px;height:18px;border:1.5px solid var(--border-2);border-radius:6px;display:grid;place-items:center;color:#fff}
.brow.sel .ck{background:var(--accent);border-color:var(--accent)}
.brow.sel .ck svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none}
.delta{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.delta.up{color:var(--ok);background:var(--ok-bg)} .delta.down{color:var(--bad);background:var(--bad-bg)} .delta.flat{color:var(--ink-3);background:var(--surface-2)}
.empty{text-align:center;color:var(--ink-3);padding:50px 20px;font-size:13.5px}
.empty b{color:var(--accent)}
.muted{color:var(--ink-4)}
.gap{height:22px}
</style>
</head>

  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;}
function stubFromIndex(ix){return {id:ix.id,name:ix.name,vendor:ix.vendor,process:ix.process,version:ix.version,
  when:(ix.when_utc||"").replace("T"," ").slice(0,16),recipe:"",libdir:"",stages:[],sigma:[],moments:[],_loaded:false,_summary:ix};}
async function ensureLoaded(b){if(!API||!b||b._loaded)return;
  try{const full=await apiGet("/api/batch/"+encodeURIComponent(b.id));
    Object.assign(b,full,{when:(full.when_utc||b.when||"").replace("T"," ").slice(0,16),_loaded:true});}
  catch(e){b._loaded=true;}}
async function refreshHistory(keepId){
  if(!API)return;
  try{const j=await apiGet("/api/history");DATA={batches:(j.index||[]).map(stubFromIndex)};
    const sel=$("#batchPick");if(sel)sel.innerHTML=DATA.batches.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("");
    if(keepId&&DATA.batches.some(b=>b.id===keepId)){state.batchId=keepId;if(sel)sel.value=keepId;}
    else if(DATA.batches.length){state.batchId=DATA.batches[0].id;if(sel)sel.value=state.batchId;}
  }catch(e){}}

/* ====================== HELPERS ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const prCls=v=>v==null?"na":v>=95?"hi":v>=90?"mid":"lo";
const fmtPR=v=>v==null?"—":v.toFixed(1)+"%";
const shortCorner=c=>String(c).replace("ssgnp_","").replace("ssgng_","").replace("_m40c","");
const ALL_TYPES=["delay","slew","hold","mpw"];
const TARGET=95;
const CHECK='<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>';
let state={batchId:DATA.batches[0].id,view:"setup",compare:new Set(),corners:[],types:[],live:null,poll:null};
const batch=()=>DATA.batches.find(b=>b.id===state.batchId)||DATA.batches[0];
const cnrs=b=>b?[...new Set([...((b.config&&b.config.corners)||[]),...((b._summary&&b._summary.corners)||[]),...((b.sigma||[]).map(r=>r.corner))])]:[];
const cornersOf=cnrs;
const typesOf=b=>[...new Set([...((b.config&&b.config.types)||[]),...((b.sigma||[]).map(r=>r.type))])];
const historyCorners=()=>[...new Set(DATA.batches.flatMap(cnrs))];

/* ====================== SETUP (editable corners + mpw) ====================== */
function viewSetup(b){
  const sugg=historyCorners().filter(c=>!state.corners.includes(c));
  return `<div class="card pad">
    <div class="sec"><h3>Run configuration</h3><span class="badge">one batch ＝ one EDA recipe</span></div>
    <div class="form">
      <div class="f"><label>Vendor</label>
        <div class="seg" data-seg="vendor">${["cdns","snps"].map(v=>`<span class="${b.vendor===v?"on":""}" data-v="${v}">${v.toUpperCase()}</span>`).join("")}</div></div>
      <div class="f"><label>Batch / recipe name</label><input id="f_name" value="${esc(b.name)}"></div>
      <div class="f"><label>Process</label><input id="f_proc" value="${esc(b.process)}"></div>
      <div class="f"><label>Process version</label><input id="f_ver" value="${esc(b.version)}"></div>
      <div class="f wide"><label>Corners</label>
        <div class="tagbox" id="cornerBox" onclick="document.getElementById('cornerInput').focus()">
          <span id="cornerTags"></span>
          <input id="cornerInput" placeholder="type a corner + Enter (e.g. ssgnp_0p455v_m40c)" autocomplete="off">
        </div>
        <div class="suggest" id="cornerSug"></div>
        <span class="hint">Corners are free-form — add any. Suggestions come from your run history.</span></div>
      <div class="f wide"><label>Timing types</label>
        <div class="chips" id="typeChips">${ALL_TYPES.map(t=>`<span class="chip ${state.types.includes(t)?"on":""}" data-t="${t}">${t}</span>`).join("")}</div></div>
      <div class="f wide"><label>FMC golden dir (decks)</label><input id="f_fmc" value="/SIM/.../N2P_${esc(b.version)}/.../gen DECKS/"></div>
      <div class="f wide"><label>Lib dir</label><input id="f_lib" value="${esc(b.libdir)}"></div>
    </div>
    <div class="actions">
      <button class="btn primary" onclick="submitRun()"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>Run certification</button>
      <span class="hint" id="runMsg">Moments derive from FMC data — no Full-MC required.</span>
    </div></div>`;
}
function renderCornerEditor(){
  const tags=$("#cornerTags"); if(!tags) return;
  tags.innerHTML=state.corners.map(c=>`<span class="tag"><b>${esc(c)}</b><span class="x" data-rm="${esc(c)}">✕</span></span>`).join("");
  tags.querySelectorAll(".x").forEach(x=>x.onclick=e=>{e.stopPropagation();removeCorner(x.dataset.rm);});
  const sug=$("#cornerSug"); const list=historyCorners().filter(c=>!state.corners.includes(c));
  sug.innerHTML=`<span class="lbl">From history:</span>`+(list.length?list.map(c=>`<span class="sug" data-add="${esc(c)}">+ ${esc(shortCorner(c))}</span>`).join(""):`<span class="muted">— none yet —</span>`);
  sug.querySelectorAll(".sug").forEach(s=>s.onclick=()=>addCorner(s.dataset.add));
}
function addCorner(c){c=(c||"").trim(); if(c&&!state.corners.includes(c)){state.corners.push(c);} const i=$("#cornerInput"); if(i)i.value=""; renderCornerEditor();}
function removeCorner(c){state.corners=state.corners.filter(x=>x!==c); renderCornerEditor();}

/* ====================== PIPELINE ====================== */
function viewPipeline(b){
  const order=["fmc_combine_data","lib_join_sigma","build_pr_table","get_pr_moments","generate_pr_web_app"];
  const label={fmc_combine_data:"FMC Combine",lib_join_sigma:"Lib Join",build_pr_table:"Sigma PR",get_pr_moments:"Moments PR",generate_pr_web_app:"Dashboard"};
  const live=state.live;
  const stmap={};
  if(live){order.forEach(s=>stmap[s]={status:live.stages[s]||"pending",reason:""});}
  else{(b.stages||[]).forEach(s=>stmap[s.stage]={status:s.status,reason:s.reason});}
  const list=order.map(s=>stmap[s]||{status:b.stages&&b.stages.length?"skipped":"pending",reason:""});
  const c=list.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});
  const steps=order.map(s=>{const st=stmap[s]||{status:"pending",reason:""};
    return `<div class="step" data-s="${st.status}"><span class="dot"></span><div class="n">${st.status}</div>
      <div class="nm">${label[s]}</div><div class="r">${esc(st.reason||"—")}</div></div>`;}).join("");
  const done=live&&["passed","partial","failed"].includes(live.state);
  const banner=live?`<div class="alert ${live.state==='failed'?'NO_DATA':(live.state==='running'||live.state==='queued')?'LOW_COVERAGE':''}" style="${live.state==='passed'||live.state==='partial'?'background:var(--ok-bg);border-color:var(--ok-line);color:#14532d':''}">
      <svg class="ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div><b>${esc(live.name)}</b> — ${esc(live.state)}${live.error?": "+esc(live.error):""}. ${done?"Completed — it is now the active batch; open the Results tab.":"Live — this view refreshes automatically."}</div></div>`:"";
  return `${banner}<div class="row k4" style="margin-bottom:18px">
      <div class="stat ok"><div class="k">Passed</div><div class="v">${c.passed||0}</div><div class="d">stages complete</div></div>
      <div class="stat warn"><div class="k">Partial</div><div class="v">${(c.partial||0)+(c.running||0)}</div><div class="d">running / partial</div></div>
      <div class="stat bad"><div class="k">Failed</div><div class="v">${c.failed||0}</div><div class="d">blocking</div></div>
      <div class="stat"><div class="k">Skipped</div><div class="v">${(c.skipped||0)+(c.pending||0)}</div><div class="d">pending / not run</div></div></div>
    <div class="card pad"><div class="sec"><h3>Pipeline</h3><span class="badge">${esc(live?live.name:b.name)}</span></div><div class="pipe">${steps}</div></div>`;
}

/* ====================== RESULTS ====================== */
function alertBanner(rows){
  const nd=rows.filter(r=>r.health==="NO_DATA").length, lc=rows.filter(r=>r.health==="LOW_COVERAGE").length;
  const ico='<svg class="ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  if(nd)return `<div class="alert NO_DATA">${ico}<div><b>${nd} corner/type with NO_DATA.</b> The lib covers 0 arcs there — pass rates are not meaningful. Verify the lib is correct/complete before trusting any number below.</div></div>`;
  if(lc)return `<div class="alert LOW_COVERAGE">${ico}<div><b>${lc} corner/type below 90% coverage.</b> Pass rates are over covered arcs only; uncovered arcs are excluded and reported.</div></div>`;
  return "";
}
const covCell=r=>{const p=r.total?Math.round(r.covered/r.total*100):0;
  return `<div class="cov"><span class="t">${r.covered}/${r.total}</span><span class="bar"><i style="transform:scaleX(${(p/100).toFixed(3)})"></i></span></div>`;};
function viewResults(b){
  const sig=b.sigma.map(r=>`<tr><td class="corner">${esc(shortCorner(r.corner))}</td><td class="typ">${esc(r.type)}</td>
    <td class="num ${prCls(r.eBase)}">${fmtPR(r.eBase)}</td><td class="num ${prCls(r.eW1)}">${fmtPR(r.eW1)}</td>
    <td class="num ${prCls(r.lBase)}">${fmtPR(r.lBase)}</td><td class="num ${prCls(r.lW1)}">${fmtPR(r.lW1)}</td>
    <td>${covCell(r)}</td><td style="text-align:right"><span class="pill ${r.health}">${r.health}</span></td></tr>`).join("");
  const mom=b.moments.map(r=>`<tr><td class="corner">${esc(shortCorner(r.corner))}</td><td class="typ">${esc(r.type)}</td>
    <td class="num ${prCls(r.ms)}">${fmtPR(r.ms)}</td><td class="num ${prCls(r.std)}">${fmtPR(r.std)}</td><td class="num ${prCls(r.skew)}">${fmtPR(r.skew)}</td>
    <td>${covCell(r)}</td><td style="text-align:right"><span class="pill ${r.health}">${r.health}</span></td></tr>`).join("");
  return `${alertBanner(b.sigma.concat(b.moments))}
    <div class="sec"><h3>Sigma</h3><span class="badge">relative-error OR CI-bounds · +W1 = CI +6% · target ${TARGET}%</span></div>
    <div class="tblcard"><table class="tbl"><thead><tr><th>Corner</th><th>Type</th><th>Early Base</th><th>Early +W1</th><th>Late Base</th><th>Late +W1</th><th>Coverage</th><th>Health</th></tr></thead><tbody>${sig}</tbody></table></div>
    <div class="gap"></div>
    <div class="sec"><h3>Moments</h3><span class="badge">from FMC data · meanshift / std / skew</span></div>
    <div class="tblcard"><table class="tbl"><thead><tr><th>Corner</th><th>Type</th><th>Meanshift</th><th>Std</th><th>Skew</th><th>Coverage</th><th>Health</th></tr></thead><tbody>${mom||`<tr><td colspan="7" class="empty">no moments data</td></tr>`}</tbody></table></div>`;
}

/* ====================== HISTORY / COMPARE ====================== */
const batchScore=b=>{const ok=b.sigma.filter(r=>r.health!=="NO_DATA"&&r.lBase!=null);return ok.length?ok.reduce((a,r)=>a+r.lBase,0)/ok.length:null;};
function viewHistory(){
  return DATA.batches.map(b=>{const sc=batchScore(b);
    const worst=b.sigma.some(r=>r.health==="NO_DATA")?"NO_DATA":b.sigma.some(r=>r.health==="LOW_COVERAGE")?"LOW_COVERAGE":"OK";
    const cls=sc==null?"bad":sc>=95?"ok":sc>=90?"warn":"bad";
    return `<div class="brow ${state.compare.has(b.id)?"sel":""}" onclick="toggleCmp('${b.id}')">
      <div class="ck">${state.compare.has(b.id)?CHECK:""}</div>
      <div><div class="nm">${esc(b.name)}</div><div class="meta">${esc(b.when||"—")} · ${esc(b.recipe||"")} · ${b.sigma.length} corner×type</div></div>
      <div><div class="mk">Vendor</div><div class="mv" style="font-size:14px">${esc(b.vendor)}</div></div>
      <div><div class="mk">Mean Late σ</div><div class="mv" style="color:var(--${cls==='ok'?'ok':cls==='warn'?'warn':'bad'})">${sc==null?"—":sc.toFixed(1)+"%"}</div></div>
      <div><div class="mk">Health</div><div style="margin-top:5px"><span class="pill ${worst}">${worst}</span></div></div>
      <div><div class="mk">Stages</div><div class="mv" style="font-size:14px;color:var(--ink-3)">${b.stages.filter(s=>s.status==='passed').length}/${b.stages.length}</div></div>
      <button class="btn" onclick="event.stopPropagation();openBatch('${b.id}')">Open</button></div>`;}).join("")
    +`<div class="actions"><button class="btn primary" onclick="go('compare')">Compare selected (${state.compare.size})</button>
      <span class="hint">Tick two or more batches, then compare recipes.</span></div>`;
}
function viewCompare(){
  const bs=[...state.compare].map(id=>DATA.batches.find(b=>b.id===id)).filter(Boolean);
  if(bs.length<2)return `<div class="card pad"><div class="empty">Select at least two batches in <b>History</b> to compare recipes side-by-side.</div></div>`;
  const keys=[...new Set(bs.flatMap(b=>b.sigma.map(r=>r.corner+"|"+r.type)))];
  const head=`<th>Corner · Type</th>`+bs.map(b=>`<th>${esc(b.version)} · ${esc(b.vendor)}</th>`).join("")+`<th>Δ first→last</th>`;
  const body=keys.map(k=>{const [c,t]=k.split("|");
    const vals=bs.map(b=>{const r=b.sigma.find(x=>x.corner===c&&x.type===t);return r?(r.health==="NO_DATA"?null:r.lBase):undefined;});
    const f=vals[0],l=vals[vals.length-1]; let d=`<span class="delta flat">—</span>`;
    if(f!=null&&l!=null){const dv=l-f; d=`<span class="delta ${dv>0?"up":dv<0?"down":"flat"}">${dv>=0?"+":""}${dv.toFixed(1)}</span>`;}
    return `<tr><td class="corner">${esc(shortCorner(c))} · <span class="typ">${esc(t)}</span></td>`+
      vals.map(v=>`<td class="num ${prCls(v)}">${v===undefined?'<span class="muted">n/a</span>':fmtPR(v)}</td>`).join("")+`<td style="text-align:right">${d}</td></tr>`;}).join("");
  return `<div class="sec"><h3>Compare recipes</h3><span class="badge">Late-sigma Base_PR across ${bs.length} batches</span></div>
    <div class="tblcard"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ====================== ROUTING ====================== */
const TITLES={setup:["Setup","configure a certification batch"],pipeline:["Pipeline","stage execution"],
  results:["Results","sigma & moments pass rates"],history:["History","all batches"],compare:["Compare","recipe comparison"]};
const VIEWS={setup:viewSetup,pipeline:viewPipeline,results:viewResults,history:viewHistory,compare:viewCompare};
function render(){
  const b=batch();
  $("#vtitle").textContent=TITLES[state.view][0];
  $("#vsub").textContent="· "+(state.view==="history"||state.view==="compare"?TITLES[state.view][1]:b.name);
  const v=el(); v.className="view show";
  v.innerHTML=(state.view==="history"||state.view==="compare")?VIEWS[state.view]():VIEWS[state.view](b);
  const c=$("#content"); c.innerHTML=""; c.appendChild(v);
  document.querySelectorAll(".navItem").forEach(n=>n.classList.toggle("active",n.dataset.view===state.view));
  if(state.view==="setup") wireSetup();
}
function el(){return document.createElement("div");}
function wireSetup(){
  renderCornerEditor();
  const inp=$("#cornerInput");
  if(inp)inp.onkeydown=e=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addCorner(inp.value.replace(/,/g,""));}
    else if(e.key==="Backspace"&&!inp.value&&state.corners.length){removeCorner(state.corners[state.corners.length-1]);}};
  document.querySelectorAll("#typeChips .chip").forEach(ch=>ch.onclick=()=>{
    const t=ch.dataset.t; state.types.includes(t)?state.types=state.types.filter(x=>x!==t):state.types.push(t);
    ch.classList.toggle("on");});
  document.querySelectorAll('.seg[data-seg="vendor"] span').forEach(s=>s.onclick=()=>{
    document.querySelectorAll('.seg[data-seg="vendor"] span').forEach(x=>x.classList.remove("on")); s.classList.add("on");});
}
async function go(v){
  state.view=v;
  if(v==="results"){await ensureLoaded(batch());}
  else if(v==="compare"){for(const id of state.compare){await ensureLoaded(DATA.batches.find(b=>b.id===id));}}
  render();
}
async function openBatch(id){
  state.batchId=id; const sel=$("#batchPick"); if(sel)sel.value=id;
  await ensureLoaded(batch()); seedConfig(); state.view="results"; render();
}
function toggleCmp(id){state.compare.has(id)?state.compare.delete(id):state.compare.add(id);render();}
function seedConfig(){const c=cornersOf(batch());state.corners=c.slice();const t=typesOf(batch());state.types=t.length?t.slice():["delay"];}

function gatherConfig(){
  const seg=document.querySelector('.seg[data-seg="vendor"] span.on');
  const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  return {name:val("f_name"),vendor:seg?seg.dataset.v:"cdns",process:val("f_proc"),process_version:val("f_ver"),
    corners:state.corners.slice(),types:state.types.slice(),fmc_golden_dir:val("f_fmc"),lib_dir:val("f_lib")};
}
async function submitRun(){
  const cfg=gatherConfig(); const m=$("#runMsg");
  const warn=t=>{if(m){m.textContent=t;m.style.color="var(--bad)";}};
  if(!cfg.corners.length)return warn("Add at least one corner first.");
  if(!cfg.types.length)return warn("Select at least one timing type.");
  if(!API){state.live=null;return go("pipeline");}        // static demo mode
  if(m){m.textContent="submitting…";m.style.color="var(--ink-3)";}
  try{
    const r=await apiPost("/api/run",cfg);
    state.live={id:r.id,name:cfg.name||r.id,state:"queued",stages:{},error:null};
    state.view="pipeline"; render(); startPolling(r.id);
  }catch(e){warn("run rejected: "+e.message);}
}
function startPolling(id){
  if(state.poll)clearInterval(state.poll);
  state.poll=setInterval(async()=>{
    let st; try{st=await apiGet("/api/status/"+encodeURIComponent(id));}catch(e){return;}
    state.live={id,name:st.name,state:st.state,stages:st.stages||{},error:st.error};
    if(state.view==="pipeline")render();
    if(["passed","partial","failed"].includes(st.state)){clearInterval(state.poll);state.poll=null;await refreshHistory(id);}
  },1200);
}
async function init(){
  if(API){await refreshHistory();}
  const sel=$("#batchPick");
  sel.innerHTML=DATA.batches.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("");
  sel.value=state.batchId; await ensureLoaded(batch()); seedConfig();
  sel.onchange=async()=>{state.batchId=sel.value;await ensureLoaded(batch());seedConfig();render();};
  document.querySelectorAll(".navItem").forEach(n=>n.onclick=()=>go(n.dataset.view));
  render();
}
init();
</script>
</body>
</html>
